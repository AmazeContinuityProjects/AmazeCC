name: Notify docs repo

# Pings AmazeContinuityProjects/docs whenever this repo's docs change, so the
# Mintlify multirepo sync re-aggregates immediately instead of waiting for the
# daily cron or a manual dispatch.
#
# Needs a repo secret DOCS_DISPATCH_TOKEN (fine-grained PAT with Contents:
# read/write on AmazeContinuityProjects/docs, or a GitHub App installation token).
# Until it exists, this workflow no-ops with a log line instead of failing red.
on:
  push:
    branches: [main]
    paths: ["docs/**"]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docs-updated to the docs repo
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DOCS_DISPATCH_TOKEN not set — skipping docs-updated dispatch"
            exit 0
          fi
          gh api repos/AmazeContinuityProjects/docs/dispatches -f event_type=docs-updated
